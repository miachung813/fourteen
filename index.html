<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>營養標示產生器</title>
<style>
  :root{
    --ink:#15191c;
    --ink-soft:#4a5258;
    --paper:#eef1f0;
    --card:#ffffff;
    --line:#d5dad8;
    --accent:#0e5a50;
    --accent-soft:#e2efec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .hero{text-align:center;margin-bottom:40px;}
  .hero .eyebrow{
    font-size:12px;letter-spacing:.2em;color:var(--accent);
    text-transform:uppercase;font-weight:700;margin-bottom:8px;
  }
  .hero h1{margin:0;font-size:28px;font-weight:800;}
  .hero p{margin:10px 0 0;color:var(--ink-soft);font-size:14px;}

  .cards{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
    width:100%;max-width:900px;
  }
  @media (max-width:820px){.cards{grid-template-columns:1fr;max-width:420px;}}

  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:28px 24px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(20,40,35,.14);
    border-color:var(--accent);
  }
  .card .flag{font-size:40px;line-height:1;margin-bottom:14px;}
  .card h2{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--accent);}
  .card .sub{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .card .go{
    margin-top:16px;font-size:13px;font-weight:700;color:var(--accent);
  }
  footer{margin-top:36px;font-size:12px;color:var(--ink-soft);text-align:center;}
</style>
</head>
<body>
  <div class="hero">
    <div class="eyebrow">Nutrition Facts Generator</div>
    <h1>營養標示產生器</h1>
    <p>請選擇要製作的營養標示類別</p>
  </div>

  <div class="cards">
    <a class="card" href="tw.html">
      <div class="flag">🇹🇼</div>
      <h2>台灣 TFDA</h2>
      <div class="sub">八大營養標示<br>營養標示（食品安全衛生管理法）</div>
      <div class="go">開始製作 →</div>
    </a>
    <a class="card" href="us.html">
      <div class="flag">🇺🇸</div>
      <h2>美國 FDA</h2>
      <div class="sub">十四大營養標示<br>Nutrition Facts（21 CFR 101.9）</div>
      <div class="go">開始製作 →</div>
    </a>
    <a class="card" href="cn.html">
      <div class="flag">🇨🇳</div>
      <h2>中國 GB 28050</h2>
      <div class="sub">五大營養標示<br>营养成分表（GB 28050-2025）</div>
      <div class="go">開始製作 →</div>
    </a>
  </div>

  <footer>本工具所提供之換算結果與表格僅供參考，請以最新公告法規內容為準。</footer>
</body>
</html>
